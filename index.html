<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ChessHub - cổng thông tin lịch học, chuyên cần, học phí và giải đấu dành cho phụ huynh, học viên trung tâm cờ."
    />
    <meta name="theme-color" content="#173d33" />
    <title>ChessHub — Đồng hành cùng kỳ thủ nhí</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23173d33%22/><text x=%2232%22 y=%2246%22 text-anchor=%22middle%22 font-size=%2244%22 fill=%22%23f7c968%22>♞</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M6 3v3m12-3v3M4 9h16M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v11H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12v3m3 6h-5a2 2 0 0 0 0 4h5v-4Z"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Zm4 9v4m-4 4h8m-6-4h4M8 6H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-location" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="ChessHub - trang chủ">
          <span class="brand-mark">♞</span>
          <span><strong>ChessHub</strong><small>HỌC CỜ • LỚN KHÔN</small></span>
        </a>

        <nav class="side-nav" id="side-nav" aria-label="Điều hướng chính"></nav>

        <div class="sidebar-support">
          <span class="support-icon">?</span>
          <p>Cần hỗ trợ?</p>
          <a href="tel:0901234567">0901 234 567</a>
        </div>

        <div class="account-mini">
          <div class="avatar avatar-parent">LP</div>
          <div><strong id="account-name">Lan Phương</strong><span id="account-role">Phụ huynh</span></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <a class="mobile-brand" href="#dashboard" aria-label="ChessHub"><span class="brand-mark">♞</span><strong>ChessHub</strong></a>
          <div class="page-heading"><span id="eyebrow">TỔNG QUAN</span><h1 id="page-title">Chào buổi chiều, chị Phương!</h1></div>
          <div class="topbar-actions">
            <label class="role-picker"><span>Giao diện</span><select id="role-select" aria-label="Chọn giao diện demo"><option value="parent">Phụ huynh</option><option value="student">Học viên</option><option value="teacher">Giáo viên</option><option value="center">Trung tâm</option></select></label>
            <button class="icon-button notification-button" type="button" aria-label="Thông báo" data-action="notifications">
              <svg><use href="#i-bell"/></svg><span class="notification-dot"></span>
            </button>
            <div class="student-picker">
              <button class="student-picker-button" type="button" aria-expanded="false" data-action="student-menu">
                <span class="avatar" id="student-avatar">MA</span>
                <span class="student-picker-copy"><small>Đang xem hồ sơ</small><strong id="student-name">Nguyễn Minh Anh</strong></span>
                <svg><use href="#i-chevron"/></svg>
              </button>
              <div class="student-menu" id="student-menu" hidden></div>
            </div>
          </div>
        </header>

        <section class="content" id="app-content" aria-live="polite"></section>
      </main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Điều hướng di động"></nav>
    </div>

    <dialog class="app-dialog" id="app-dialog">
      <form method="dialog" id="dialog-form">
        <button class="dialog-close" value="cancel" aria-label="Đóng"><svg><use href="#i-close"/></svg></button>
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
